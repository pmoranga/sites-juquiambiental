name: Build Static Branch

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch that receives the generated static files"
        required: false
        default: "static-build"
      base_url:
        description: "Base URL used by Hugo while building"
        required: false
        default: "https://juquiambiental.com/"

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  HUGO_VERSION: 0.164.0
  TARGET_BRANCH: ${{ github.event.inputs.branch || 'static-build' }}
  BUILD_BASE_URL: ${{ github.event.inputs.base_url || 'https://juquiambiental.com/' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.ref_name != github.event.inputs.branch
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Hugo
        run: |
          mkdir -p "${HOME}/.local/hugo"
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Build
        run: |
          hugo --gc --minify --baseURL "${BUILD_BASE_URL}" --cacheDir "${{ runner.temp }}/hugo_cache"

      - name: Publish generated files
        run: |
          set -euo pipefail

          publish_dir="${{ runner.temp }}/publish"
          mkdir -p "${publish_dir}"
          cp -a public/. "${publish_dir}/"
          touch "${publish_dir}/.nojekyll"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "${TARGET_BRANCH}" || true

          if git show-ref --verify --quiet "refs/remotes/origin/${TARGET_BRANCH}"; then
            git switch --create "${TARGET_BRANCH}" --track "origin/${TARGET_BRANCH}"
            git rm -r --ignore-unmatch .
          else
            git switch --orphan "${TARGET_BRANCH}"
            git rm -rf .
          fi

          cp -a "${publish_dir}/." .
          git add -A

          if git diff --cached --quiet; then
            echo "No static branch changes to publish."
            exit 0
          fi

          git commit -m "Build static site"
          git push origin "HEAD:${TARGET_BRANCH}"
